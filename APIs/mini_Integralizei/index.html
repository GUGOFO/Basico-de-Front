<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="envio">
        <div id="texto">
            <h1>Integralizei UnB</h1>
            <h2>Envie seu historico academico em PDF</h2>
            <h3>NENHUM DADO SENSIVEL SERÁ ARMAZENADO</h3>
        </div>
        <input type="file" id="inputImage" accept="image/pdf" style="display: none;">
        <label for="inputImage" id="containerDoInput">
            <i class="fa-solid fa-cloud-arrow-up" id="imgNuvenzinha"></i>
            <h2>Arraste seu arquivo para aqui</h2>
            <h3>Ou clique para selecionar</h3>
        </label>
        <input type="submit" value="Enviar Historico" id="btnAnalisar">
    </div>

    <div id="diciplinas">

        <h1 id="tituloDisciplinas">Suas Disciplinas</h1>

        <div class="diciplina">
            <div class="divNomes">
                <h1 class="nomeDaDisciplina">ALGORITMOS E PROGRAMAÇÃO DE COMPUTADORES</h1>
                <h2 class="professorDaDisciplina">MSc. ROSE YURI SHIMIZU</h2>
                <h2 class="codigoDaDisciplina">CIC0004</h2>
            </div>
            <div class="cargaHoraria">90</div>
        </div>

    </div>

    <script src="https://kit.fontawesome.com/cbdc817e30.js" crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>
</html>
