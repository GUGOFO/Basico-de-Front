<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>span</title>
</head>
<body>
    
    <!-- O span basicamente faz a parte especifica doque voce quer mecher poder ser modificado -->

    <h1>Oiiii</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. <span style="color: blue;">Atque quo nobis, adipisci, ullam provident veritatis reprehenderit nesciunt enim cumque voluptatum</span>, itaque asperiores maxime. Accusantium amet porro fugiat, numquam iure quo!</p>

</body>
</html>
