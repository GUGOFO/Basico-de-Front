<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelinha</title>
</head>
<body>
    
    <h1 align="center">Lojinha</h1>

    <table bgcolor = "black" align="center" width = "700"> <!-- Para criação da tabela -->
        <tr bgcolor = "grey" > <!-- Cria uma Linha (Table ROW) --> <!-- Cor do fundo  -->
            <th width = "100">Segunda</th> <!-- Cria o CABEÇARIO, ou seja, vai estar em negrito -->
            <th width = "100">Terça</th>
            <th width = "100">Quarta</th>
            <th width = "100">Quinta</th>
            <th width = "100">Sexta</th>
            <th width = "100">Sabado</th>
            <th width = "100">Domingo</th>
        </tr> 
            
        <tr bgcolor= "lightgrey" align="center">
            <td>8-15</td> <!-- Tabelinha normal -->
            <td>8-15</td>
            <td>8-15</td>
            <td>8-15</td>
            <td>8-15</td>
            <td>FECHADA</td>
            <td>FECHADA</td>
        </tr>
    </table>

</body>
</html>
