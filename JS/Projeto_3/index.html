<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="conversor">
        <h1>Conversor de Temperatura</h1>
        
        <input type="text" name="caixa" id="caixa_de_texto" placeholder="0">

        <div>
            <input type="radio" id="btn-Celsius" name="conversao"  checked>
            <label for="btn-Celsius"> Celsius > Fehrenheit</label>
        </div>
            
        <div>
            <input type="radio" id="btn-Fehrenheit" name="conversao">
            <label for="btn-Fehrenheit">Fehrenheit > Celsius</label>
        </div>

        <button id="btn-enviar">Enviar</button>
        <h2 id="resultado">2</h2>
    </div>


    <script src="index.js"></script>
</body>
</html>
